<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in</title>
<link rel="icon" href="/icons/momentum-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/skins.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#26211a);background:var(--paper,#f7f4ee);
       min-height:100vh;display:grid;place-items:center;padding:26px 20px}
  .card{background:var(--card,#fff);border:1px solid var(--line,#e6ddcb);border-radius:20px;max-width:520px;width:100%;
        padding:28px 26px 22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
  .top{text-align:center;margin-bottom:20px}
  .mk{width:54px;height:54px;border-radius:14px;margin:0 auto 12px;display:block}
  h1{font-family:Georgia,serif;margin:0 0 4px;font-size:25px;letter-spacing:-.01em}
  .sub{color:var(--mut,#847a68);font-size:13.5px;line-height:1.45}
  .sub b{color:var(--ink2,#3b4448)}
  .nm{margin:0 0 16px}
  .nm label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:700;margin-bottom:6px}
  .nm input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;font-size:14px;
            background:var(--paper);color:var(--ink)}
  .seats{display:flex;flex-direction:column;gap:8px}
  .seat{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
        background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
        font:inherit;color:var(--ink);transition:.13s}
  .seat:hover{border-color:var(--accent);transform:translateY(-1px)}
  .seat .in{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
            font-family:Georgia,serif;font-weight:800;font-size:15px;background:var(--accent);color:var(--onAccent)}
  .seat .t{flex:1;min-width:0}
  .seat .t b{display:block;font-size:14.5px;font-weight:700}
  .seat .t span{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.35}
  .seat .ar{color:var(--mut);flex:none;font-size:15px}
  .seat.ours{opacity:.72}
  .seat.ours .in{background:var(--line);color:var(--mut)}
  .note{margin-top:16px;background:var(--cream);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
        font-size:12.5px;color:var(--ink2);line-height:1.5}
  .note b{color:var(--ink)}
  .pass{display:none;margin-top:12px}
  .pass label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:700;margin-bottom:6px}
  .pass input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;background:var(--paper);color:var(--ink)}
  .err{color:#e0704f;font-size:13px;margin-top:10px;min-height:16px;text-align:center}
  .credit{color:var(--mut);font-size:11.5px;text-align:center;margin-top:16px}
  .back{display:block;text-align:center;margin-top:12px;font-size:12.5px;color:var(--mut);text-decoration:none}
  .back:hover{color:var(--accent)}
</style>
<meta name="theme-color" content="#0f9d9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="format-detection" content="telephone=yes">
<link rel="apple-touch-icon" href="/momentum-logo.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div class="card">
  <div class="top">
    <img class="mk" id="mk" src="/icons/momentum-mark.svg" alt="">
    <h1 id="ttl">Your gym</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="nm">
    <label for="name">Your name <span style="text-transform:none;letter-spacing:0;font-weight:500">— optional, so the hub can say hello</span></label>
    <input id="name" placeholder="e.g. Katie" autocomplete="name">
  </div>
  <div class="seats" id="seats"></div>
  <div class="pass" id="passWrap">
    <label for="pass">Administrator passcode</label>
    <input id="pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')window.__goAdmin()">
  </div>
  <div class="err" id="err"></div>
  <div class="note" id="note"></div>
  <a class="back" id="back" href="/welcome.html">← Back to the welcome page</a>
  <div class="credit" id="credit"></div>
</div>
<script>
(function(){
  /* Every other page gets its colours from hub-nav.js. This one has no nav, which is why it
     used to render as a bare white card while the rest of the hub wore the house skin. */
  try{ if(window.HubSkins) window.HubSkins.applyLive(window.HubSkins.currentId()); }catch(e){}
  var C=window.HUB_CONFIG||{}, BR=C.brand||{}, R=C.roles||{}, P=C.rolePretty||{}, SEC=C.sections||[];
  var ALL=SEC.length;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function labelOf(k){ for(var i=0;i<SEC.length;i++) if(SEC[i].k===k) return SEC[i].label; return null; }
  /* What each seat actually sees — read straight off the roles map, never hand-written,
     so it can never drift from what the hub really does. */
  function blurb(r){
    var v=R[r];
    if(v==='*') return 'Every room — all '+ALL+' of them';
    var names=(v||[]).map(labelOf).filter(Boolean);
    if(!names.length) return 'No rooms yet';
    var head=names.slice(0,3).join(' · ');
    return head + (names.length>3 ? ' · +'+(names.length-3)+' more' : '');
  }
  var BADGE={ manager:'OW', frontdesk:'FD', coach:'CO', trainee:'CT', teacher:'TE', parent:'PA', admin:'AE' };
  function initials(r){
    if(BADGE[r]) return BADGE[r];
    var t=String(P[r]||r).replace(/[^A-Za-z ]/g,'').trim().split(/\s+/);
    return ((t[0]||' ')[0]+((t[1]||'')[0]||'')).toUpperCase();
  }

  document.getElementById('ttl').textContent = BR.short ? ('Your gym · '+BR.short) : 'Your gym';
  document.getElementById('sub').innerHTML = 'Pick your seat — <b>one click, no password</b>.<br>Everybody walks into their own view of '+esc(BR.name||'the gym')+'.';
  document.getElementById('credit').innerHTML = BR.credit||'';
  document.title='Sign in · '+(BR.name||'Hub');
  document.getElementById('note').innerHTML =
    '<b>This is the private preview.</b> Every seat sees only its own rooms — try one, then use the name in the top corner to switch. '+
    'There are no passwords yet, on purpose. When you are ready to lock it down so only your people can get in, tell Anthony and he flips that switch.';

  /* Owner first, our own admin seat last and quieter — this page belongs to the gym. */
  var ORDER=['manager','frontdesk','coach','trainee','teacher','parent','admin'];
  var roles=ORDER.filter(function(r){return R[r];}).concat(Object.keys(R).filter(function(r){return ORDER.indexOf(r)<0 && r!=='guest';}));

  document.getElementById('seats').innerHTML = roles.map(function(r){
    return '<button class="seat'+(r==='admin'?' ours':'')+'" data-r="'+esc(r)+'">'+
      '<span class="in">'+esc(initials(r))+'</span>'+
      '<span class="t"><b>'+esc(P[r]||r)+'</b><span>'+esc(blurb(r))+'</span></span>'+
      '<span class="ar">→</span></button>';
  }).join('');

  function enter(role){
    var name=document.getElementById('name').value.trim();
    var pass=(document.getElementById('pass')||{}).value||'';
    document.getElementById('err').textContent='';
    fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'signin',role:role,name:name,pass:pass})})
      .then(function(r){return r.json();}).then(function(j){
        if(j&&j.ok){ try{localStorage.setItem('hub_sess',j.token);}catch(e){} location.href='/hub.html?sess='+encodeURIComponent(j.token); }
        else if(j&&j.error==='PASS'){ document.getElementById('passWrap').style.display='block';
          document.getElementById('err').textContent='Administrator passcode needed.'; document.getElementById('pass').focus(); }
        else document.getElementById('err').textContent=(j&&j.message)||'Could not sign in.';
      }).catch(function(){ document.getElementById('err').textContent='Network hiccup — try again.'; });
  }
  window.__goAdmin=function(){ enter('admin'); };
  document.getElementById('seats').addEventListener('click',function(e){
    var b=e.target.closest('.seat'); if(b) enter(b.getAttribute('data-r'));
  });
})();
</script>
</body>
</html>
