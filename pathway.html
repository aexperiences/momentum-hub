<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Skill Pathways</title>
<link rel="icon" href="/icons/momentum-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/skins.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#2a201a);background:var(--paper,#fbf7f2);min-height:100vh}
  h1,h2,h3{font-family:Georgia,serif;font-weight:800;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 90px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .lede{color:var(--mut);font-size:15px;max-width:64ch;margin:8px 0 20px;line-height:1.6}
  .lad{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(80,50,20,.05);margin-bottom:16px;overflow:hidden}
  .lh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--cream);flex-wrap:wrap}
  .lh h2{font-size:17px}
  .lh .sp{flex:1}
  .mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .rungs{padding:14px 16px;display:flex;flex-direction:column;gap:0}
  .rung{display:flex;gap:13px;align-items:flex-start;position:relative;padding:0 0 16px 0}
  .rung:last-child{padding-bottom:0}
  .rail{width:14px;flex:none;display:flex;flex-direction:column;align-items:center;align-self:stretch}
  .bead{width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px;box-shadow:0 0 0 3px var(--card)}
  .line{width:2px;flex:1;background:var(--line);margin-top:2px}
  .rung:last-child .line{display:none}
  .rbody{flex:1;min-width:0}
  .rname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rnote{font-size:12.5px;color:var(--mut);margin-top:2px}
  .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11.5px;font-weight:600;background:var(--cream);color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
  .chip.count{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:transparent;color:var(--accent);font-weight:700}
  .next{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
  .edit{display:none;gap:8px;flex-wrap:wrap;margin-top:8px}
  .edit.on{display:flex}
  input.f{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)}
  input.f.nm{min-width:190px}
  input.f.nt{flex:1;min-width:220px}
  .del{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--mut);cursor:pointer}
  .del:hover{border-color:#c07a5e;color:#a2492a}
  .addr{margin-top:6px}
  .btn{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--onAccent);border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-family:Georgia,serif;font-size:13.5px;cursor:pointer}
  .none{font-size:13px;color:var(--mut);padding:10px 0}
  .kidrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
  .kidrow:last-child{border-bottom:none}
  .kidrow b{font-size:14px}
  .kidrow .fm{font-size:11.5px;color:var(--mut)}
  .kidrow .sp{flex:1}
  .arrow{font-size:12.5px;color:var(--mut)}
  .arrow b{color:var(--accent)}
  .samp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--cream);color:var(--mut);padding:2px 7px;border-radius:99px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:80}.toast.on{opacity:1}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}
</style>
<meta name="theme-color" content="#0f9d9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<link rel="apple-touch-icon" href="/momentum-logo.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<script src="/hub-nav.js" defer></script>
<script src="/data.js"></script>
<script src="/roomguard.js"></script>
<script src="/assistant.js" defer></script>

<div class="wrap">
  <div class="eyebrow" id="eb"></div>
  <h1>Skill Pathways</h1>
  <p class="lede">Every progression you run, and who is standing on each rung. “What is my kid working toward next?” is the question families ask most — this is the page that answers it. Edit any rung and it changes everywhere, including the Floor Studio.</p>
  <div id="lads"></div>

  <div class="lad">
    <div class="lh"><h2>Where each kid is</h2><span class="sp"></span><span class="chip" id="kidCount"></span></div>
    <div class="rungs" id="kidList" style="padding-top:6px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var el=function(i){return document.getElementById(i);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var C=window.HUB_CONFIG||{}, BR=C.brand||{}, PC=C.programColors||{};
  var LADS=[], KIDS=[], editing={};
  el('eb').textContent=(BR.center||BR.name||'');

  function load(){
    Promise.all([window.HUBDATA.list('ladders'),window.HUBDATA.list('kids')])
      .then(function(r){ LADS=r[0]||[]; KIDS=r[1]||[]; render(); });
  }

  /* which rung is this kid on, and what is the one after it */
  function place(kid){
    for(var i=0;i<LADS.length;i++){
      var L=LADS[i], rs=L.rungs||[];
      for(var j=0;j<rs.length;j++){
        if(String(rs[j].name||'').toLowerCase() === String(kid.level||'').toLowerCase())
          return { ladder:L, at:j, next: rs[j+1] || null };
      }
    }
    return null;
  }

  function render(){
    el('lads').innerHTML = LADS.map(function(L,li){
      var rs=L.rungs||[];
      return '<div class="lad"><div class="lh">'+
        '<span class="bead" style="background:'+esc((rs[0]&&rs[0].color)||PC[L.program]||'#9a8b7d')+'"></span>'+
        '<h2>'+esc(L.title||L.program||'Pathway')+'</h2><span class="sp"></span>'+
        '<button class="mini" data-ed="'+li+'">'+(editing[li]?'Done':'Edit rungs')+'</button></div>'+
        '<div class="rungs">'+ rs.map(function(r,ri){
          var on=KIDS.filter(function(k){return String(k.level||'').toLowerCase()===String(r.name||'').toLowerCase();});
          return '<div class="rung">'+
            '<span class="rail"><span class="bead" style="background:'+esc(r.color||'#9a8b7d')+'"></span><span class="line"></span></span>'+
            '<span class="rbody">'+
              '<span class="rname">'+esc(r.name||'')+(on.length?'<span class="chip count">'+on.length+' here</span>':'')+'</span>'+
              '<div class="rnote">'+esc(r.note||'')+'</div>'+
              (on.length?'<div class="who">'+on.map(function(k){return '<span class="chip">'+esc(k.child)+'</span>';}).join('')+'</div>':'')+
              '<div class="edit'+(editing[li]?' on':'')+'">'+
                '<input class="f nm" value="'+esc(r.name||'')+'" data-l="'+li+'" data-r="'+ri+'" data-k="name" placeholder="Rung name">'+
                '<input class="f nt" value="'+esc(r.note||'')+'" data-l="'+li+'" data-r="'+ri+'" data-k="note" placeholder="What they work on here">'+
                '<button class="del" data-del="'+li+'" data-dr="'+ri+'">Remove</button>'+
              '</div>'+
            '</span></div>';
        }).join('')+
        (editing[li]?'<div class="addr"><button class="btn" data-add="'+li+'">＋ Add a rung</button></div>':'')+
        '</div></div>';
    }).join('') || '<div class="lad"><div class="rungs"><div class="none">No pathways yet.</div></div></div>';

    el('lads').querySelectorAll('[data-ed]').forEach(function(b){
      b.addEventListener('click',function(){ var i=b.getAttribute('data-ed'); if(editing[i]) saveLad(+i); editing[i]=!editing[i]; render(); });
    });
    el('lads').querySelectorAll('input.f').forEach(function(inp){
      inp.addEventListener('input',function(){
        var L=LADS[+inp.getAttribute('data-l')]; if(!L) return;
        L.rungs[+inp.getAttribute('data-r')][inp.getAttribute('data-k')]=inp.value;
      });
    });
    el('lads').querySelectorAll('[data-add]').forEach(function(b){
      b.addEventListener('click',function(){
        var L=LADS[+b.getAttribute('data-add')];
        L.rungs=L.rungs||[]; L.rungs.push({name:'New rung',note:'',color:'#9a8b7d'}); render();
      });
    });
    el('lads').querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click',function(){
        var L=LADS[+b.getAttribute('data-del')], ri=+b.getAttribute('data-dr');
        var r=L.rungs[ri];
        var on=KIDS.filter(function(k){return String(k.level||'').toLowerCase()===String(r.name||'').toLowerCase();});
        if(on.length && !confirm(on.length+' kid'+(on.length>1?'s are':' is')+' on “'+r.name+'”. Remove the rung anyway? They will show as needing a level.')) return;
        L.rungs.splice(ri,1); render();
      });
    });

    /* --- where each kid is --- */
    el('kidCount').textContent=KIDS.length+' kids';
    el('kidList').innerHTML = KIDS.length ? KIDS.map(function(k){
      var p=place(k);
      var right = !p ? '<span class="arrow" style="color:var(--mut)">no level set</span>'
        : (p.next ? '<span class="arrow">next: <b>'+esc(p.next.name)+'</b></span>'
                  : '<span class="arrow"><b>top of the ladder</b></span>');
      return '<div class="kidrow"><b>'+esc(k.child)+'</b><span class="fm">'+esc(k.level||'')+'</span>'+
             (k.sample?'<span class="samp">sample</span>':'')+'<span class="sp"></span>'+right+'</div>';
    }).join('') : '<div class="none">No kids yet — bring your roster in and everyone lands on a rung.</div>';
  }

  function saveLad(i){
    var L=LADS[i]; if(!L) return;
    window.HUBDATA.save('ladders',L).then(function(){ toast('Pathway saved.'); });
  }

  function toast(m){var t=el('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2400);}
  window.AssistantContext=function(){ return { view:'the skill pathways / level ladders', center:BR.center,
    ladders:LADS.map(function(L){return {title:L.title, rungs:(L.rungs||[]).map(function(r){return r.name;})};}),
    kids:KIDS.map(function(k){var p=place(k);return {child:k.child, level:k.level, next:p&&p.next?p.next.name:null};}) }; };
  window.RoomGuard("pathway", function(role, seat){ window.SEAT=seat; load(); });
})();
</script>
</body>
</html>
