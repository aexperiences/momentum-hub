<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Command Center</title>
<link rel="icon" href="/icons/momentum-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/skins.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#26211a);background:var(--paper,#f7f4ee);min-height:100vh}
  h1,h2,h3{font-family:Georgia,serif;font-weight:800;letter-spacing:-.01em;margin:0}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 70px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .hi{margin:16px 0 4px;font-size:30px}
  .sub{color:var(--ink2);margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .tile{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 16px;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(60,45,20,.06);transition:.14s}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 26px rgba(60,45,20,.1)}
  .tile .ic{width:76px;height:76px;border-radius:18px;display:block;box-shadow:0 4px 12px rgba(60,45,20,.20)}
  .tile .tl{font-family:Georgia,serif;font-weight:700;font-size:17px}
  .tile .ds{font-size:12.5px;color:var(--mut)}
  .credit{color:var(--mut);font-size:12px;text-align:center;margin-top:34px}
  .credit b{color:var(--ink2)}
  /* Command Center cockpit — computed live from the seed. Status colors are RESERVED
     (ok / nearly full / full) and never follow the skin; everything else does. */
  .cockpit{margin:0 0 22px;display:flex;flex-direction:column;gap:14px;
    --cc-ok:#0f9d9d;--cc-warn:#dda12e;--cc-full:#c2492a}
  .cc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .cc-stat{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px 15px 19px;box-shadow:0 6px 18px rgba(60,45,20,.06);overflow:hidden}
  .cc-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .cc-n{font-family:Georgia,serif;font-weight:800;font-size:27px;color:var(--ink);line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .cc-l{font-size:11px;color:var(--mut);margin-top:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .cc-ctx{font-size:11.5px;color:var(--mut);margin-top:7px;padding-top:7px;border-top:1px dotted var(--line)}
  .cc-cols{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
  @media(max-width:720px){.cc-cols{grid-template-columns:1fr}}
  .cc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;box-shadow:0 6px 18px rgba(60,45,20,.06)}
  .cc-h{font-family:Georgia,serif;font-weight:700;font-size:15px}
  .cc-hs{font-size:11.5px;color:var(--mut);margin:3px 0 13px}
  .cc-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12.5px}
  .cc-pl{width:92px;flex:none;color:var(--ink2)}
  .cc-track{flex:1;height:14px;background:var(--cream);border-radius:99px;position:relative;overflow:hidden}
  .cc-track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s ease}
  .cc-pv{width:56px;flex:none;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:600}
  .cc-chip{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 7px;border-radius:99px;border:1px solid currentColor;width:74px;text-align:center}
  .cc-chip.is-none{border-color:transparent;color:transparent}
  .cc-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--mut)}
  .cc-key b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .cc-dcard{display:flex;flex-direction:column}
  .cc-dwrap{display:flex;align-items:center;gap:16px;margin-top:4px}
  .cc-donut{width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center}
  .cc-donut span{width:86px;height:86px;background:var(--card);border-radius:50%;display:flex;align-items:center;
    justify-content:center;flex-direction:column;font-family:Georgia,serif;font-weight:800;font-size:24px;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .cc-donut small{display:block;font-size:9.5px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .cc-dleg{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:7px}
  .cc-dleg div{display:flex;align-items:center;gap:7px}
  .cc-dleg b{width:10px;height:10px;border-radius:3px;flex:none}
  .cc-dleg em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
  .cc-sub{font-size:11.5px;color:var(--mut);margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
</style>
<meta name="theme-color" content="#0f9d9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="format-detection" content="telephone=yes">
<link rel="apple-touch-icon" href="/momentum-logo.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<script src="/hub-nav.js" defer></script>
<script src="/assistant.js" defer></script>
<div class="wrap">
  <div class="eyebrow" id="eb"></div>
  <h1 class="hi" id="hi">Command Center</h1>
  <div class="sub" id="sub">Everything you run, in one place.</div>
  <div class="cockpit" id="cockpit" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="credit" id="credit"></div>
</div>
<script>
(function(){
  var C=window.HUB_CONFIG||{}, BR=C.brand||{}, SEC=C.sections||[], ROLES=C.roles||{}, ALL=SEC.map(function(s){return s.k;});
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  document.title=(BR.name||'Hub')+' · Command Center';
  document.getElementById('eb').textContent=BR.name||'';
  document.getElementById('credit').innerHTML=esc(BR.credit||'');
  function allowed(roles){ if(!roles||!roles.length)roles=['guest']; var set={}; roles.forEach(function(r){var v=ROLES[r]; if(v==='*')ALL.forEach(function(k){set[k]=1;}); else (v||[]).forEach(function(k){set[k]=1;});}); return ALL.filter(function(k){return set[k];}); }
  var blurb={}; SEC.forEach(function(s){ if(s.ds) blurb[s.k]=s.ds; });  // per-section one-liners from config; fall back to label
  (window.hubWho||Promise.resolve(null)).then(function(w){
    var roles=(w&&(w.roles||(w.role?[w.role]:[])))||['guest']; var name=(w&&w.name)||'';
    document.getElementById('hi').textContent=name?('Welcome, '+name):'Command Center';
    var PRIV0=(window.HUB_CONFIG||{}).privacy||{};
    var restricted=(PRIV0.readOnlyFor||[]).some(function(r){return roles.indexOf(r)>=0;});
    document.getElementById('sub').textContent = restricted
      ? 'Your team, your schedule and your travel — all in one place.'
      : 'Here’s everything you can open in '+(BR.name||'the hub')+'.';
    var keys=allowed(roles).filter(function(k){return k!=='home';});
    var tiles=keys.map(function(k){var s=SEC.filter(function(x){return x.k===k;})[0]; if(!s)return ''; var S=(new URLSearchParams(location.search).get('sess'))?('?sess='+encodeURIComponent(new URLSearchParams(location.search).get('sess'))):'';
      return '<a class="tile" href="'+s.href+S+'"><img class="ic" alt="" src="'+(s.ic||'')+'"><div class="tl">'+esc(s.label)+'</div><div class="ds">'+esc(blurb[k]||('Open '+s.label.toLowerCase()))+'</div></a>';}).join('');
    document.getElementById('grid').innerHTML=tiles||'<div class="ds" style="color:var(--mut)">Nothing to show yet — sign in to see your sections.</div>';
  });
})();
</script>
<script>
/* Command Center cockpit — colored graphs computed live from HUB_CONFIG.seed. Role-aware; never fabricated. */
(function(){
  var C=window.HUB_CONFIG||{}, SD=C.seed||{}, PC=C.programColors||{}, ROLES=C.roles||{}, ALL=(C.sections||[]).map(function(s){return s.k;});
  var classes=SD.classes||[], fams=SD.families||[];
  function money(n){return '$'+Math.round(n).toLocaleString();}
  var enrolled=0,cap=0,monthly=0,wait=0,byP={};
  classes.forEach(function(c){var e=+c.enrolled||0,cp=+c.cap||0,t=+c.tuition||0;enrolled+=e;cap+=cp;monthly+=e*t;
    if(e>=cp||/waitlist/i.test(c.notes||''))wait++;
    var p=c.program||'Other'; byP[p]=byP[p]||{e:0,c:0}; byP[p].e+=e; byP[p].c+=cp;});
  var fill=cap?Math.round(enrolled/cap*100):0;
  function render(keys){
    var el=document.getElementById('cockpit'); if(!el)return;
    /* Status colours are RESERVED and do not follow the skin — but they do get a dark-mode
       step, validated against the dark surface rather than flipped automatically. */
    var isDark=!!((window.HUB_CONFIG||{}).activeSkin||{}).dark;
    el.style.setProperty('--cc-warn', isDark?'#b8862a':'#dda12e');
    el.style.setProperty('--cc-full', isDark?'#e2607a':'#c2492a');
    // PRIVACY GATE - the cockpit is the OWNER's board: headcounts, fill rates and
    // revenue. A parent seat has no business seeing what the gym earns, so it is
    // shut off by role directly rather than inferred from which rooms they hold.
    var PRIV=(window.HUB_CONFIG||{}).privacy||{}, RO=PRIV.readOnlyFor||[];
    var isRestricted=(window.__HUB_ROLES__||[]).some(function(r){return RO.indexOf(r)>=0;});
    if(isRestricted){el.hidden=true;return;}
    var canEnroll=keys.indexOf('enroll')>=0||keys.indexOf('tuition')>=0, canMoney=keys.indexOf('books')>=0;
    if(!canEnroll){el.hidden=true;return;}
    var progN=Object.keys(byP).length;
    var cards=[['Kids enrolled',enrolled,'of '+cap+' seats across the gym'],
               ['Classes running',classes.length,'across '+progN+' program'+(progN===1?'':'s')],
               ['Families',fams.length,'on the roster']];
    cards.push(canMoney?['Monthly tuition',money(monthly),enrolled?money(monthly/enrolled)+' a kid':'']
                       :['Full · waitlist',wait,wait?'class'+(wait===1?'':'es')+' at capacity':'every class has room']);
    var cardsH=cards.map(function(c){return '<div class="cc-stat"><div class="cc-n">'+c[1]+'</div><div class="cc-l">'+c[0]+'</div>'+
      (c[2]?'<div class="cc-ctx">'+c[2]+'</div>':'')+'</div>';}).join('');
    var nFull=0,nWarn=0,CHIPS=false;
    Object.keys(byP).forEach(function(p){var d=byP[p];if(d.c&&d.e/d.c>=0.9)CHIPS=true;});
    var bars=Object.keys(byP).map(function(p){
      var d=byP[p],pct=d.c?Math.round(d.e/d.c*100):0;
      var state=pct>=100?'full':(pct>=90?'warn':'ok');
      if(state==='full')nFull++; else if(state==='warn')nWarn++;
      var col=state==='full'?'var(--cc-full)':(state==='warn'?'var(--cc-warn)':'var(--accent)');
      var chip=state==='full'?'<span class="cc-chip" style="color:var(--cc-full)">Full</span>'
              :(state==='warn'?'<span class="cc-chip" style="color:var(--cc-warn)">'+(d.c-d.e)+' left</span>'
              :'<span class="cc-chip is-none">.</span>');
      if(state==='ok')chip=CHIPS?chip:'';
      return '<div class="cc-row"><span class="cc-pl">'+p+'</span>'+
        '<span class="cc-track"><i style="width:'+Math.min(pct,100)+'%;background:'+col+'"></i></span>'+
        '<span class="cc-pv">'+d.e+'/'+d.c+'</span>'+chip+'</div>';}).join('');
    var key='<div class="cc-key">'+
      '<span><b style="background:var(--accent)"></b>Room to grow</span>'+
      '<span><b style="background:var(--cc-warn)"></b>Nearly full — 90% or more</span>'+
      '<span><b style="background:var(--cc-full)"></b>Full — the rest go on a waitlist</span></div>';
    var open=Math.max(cap-enrolled,0);
    var don='<div class="cc-dwrap"><div class="cc-donut" style="background:conic-gradient(var(--accent) '+(fill*3.6)+'deg,var(--cream) 0)">'+
      '<span>'+fill+'%<small>full</small></span></div>'+
      '<div class="cc-dleg">'+
        '<div><b style="background:var(--accent)"></b>Seats taken <em>'+enrolled+'</em></div>'+
        '<div><b style="background:var(--cream);box-shadow:inset 0 0 0 1px var(--line)"></b>Seats open <em>'+open+'</em></div>'+
        '<div><b style="background:var(--cc-full)"></b>Classes at capacity <em>'+wait+'</em></div>'+
      '</div></div>';
    var head=nFull?(nFull+' program'+(nFull===1?' is':'s are')+' full'+(nWarn?', '+nWarn+' nearly there':''))
                  :(nWarn?nWarn+' program'+(nWarn===1?' is':'s are')+' nearly full':'every program still has room');
    el.innerHTML='<div class="cc-stats">'+cardsH+'</div>'+
      '<div class="cc-cols">'+
        '<div class="cc-card"><div class="cc-h">Enrollment by program</div>'+
          '<div class="cc-hs">Seats taken against seats available \u2014 '+head+'.</div>'+bars+key+'</div>'+
        '<div class="cc-card cc-dcard"><div class="cc-h">Gym fill rate</div>'+
          '<div class="cc-hs">Every class, added up.</div>'+don+
          '<div class="cc-sub">'+enrolled+' of '+cap+' seats filled across '+classes.length+' classes. '+'The class list is your real Fall 2026 schedule; the seat counts are sample until we connect your roster.</div></div>'+
      '</div>';
    el.hidden=false;
  }
  (window.hubWho||Promise.resolve(null)).then(function(w){
    var roles=(w&&(w.roles||(w.role?[w.role]:[])))||['guest'], set={};
    window.__HUB_ROLES__=roles;
    roles.forEach(function(r){var v=ROLES[r]; if(v==='*')ALL.forEach(function(k){set[k]=1;}); else (v||[]).forEach(function(k){set[k]=1;});});
    var keys=ALL.filter(function(k){return set[k];}); if(!keys.length)keys=(ROLES.guest==='*'?ALL.slice():[]);
    render(keys);
  });
})();
</script>
</body>
</html>
