<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Team App</title>
<link rel="icon" href="/icons/momentum-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/skins.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#0f1417);background:var(--paper,#f5f8f8);min-height:100vh}
  h1,h2,h3{font-family:Georgia,serif;font-weight:800;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 70px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
  @media(max-width:760px){.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpis>*{min-width:0}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
  .stat .n{font-family:Georgia,serif;font-weight:800;font-size:20px;color:var(--accent)}
  .stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .grid{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
  @media(max-width:840px){.grid{grid-template-columns:1fr}}
  .rail{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px}
  .railhead{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .railhead .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .railhead .sp{flex:1}
  .addbtn{background:var(--accent);color:var(--onAccent);border:none;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;border-left:4px solid var(--accent);transition:.12s}
  .team:hover{background:var(--cream)}
  .team.on{border-color:var(--accent);box-shadow:0 4px 14px rgba(15,60,60,.10)}
  .team .tn{font-weight:800;font-size:14px}
  .team .tm{font-size:11px;color:var(--mut);margin-top:2px}
  .lv{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;margin-top:6px}
  .lv.comp{background:#d3efee;color:#0a6f6f}.lv.exh{background:#e4f4f3;color:#0e7490}.lv.rec{background:#eceff1;color:#334155}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .thead{display:flex;align-items:flex-start;gap:12px;margin-bottom:2px}
  .thead .tt{font-family:Georgia,serif;font-weight:800;font-size:21px}
  .thead .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
  .sp{flex:1}
  .btn{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--onAccent);border:none;border-radius:9px;padding:9px 13px;font-weight:700;font-family:Georgia,serif;font-size:13px;cursor:pointer}
  .lnk{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .sec-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .ev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
  .ev .er{display:flex;align-items:center;gap:10px}
  .ev .type{font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:99px}
  .type.Practice{background:rgba(0,0,0,.06);color:var(--ink2)}.type.Competition{background:#d3efee;color:#0a6f6f}.type.Showcase{background:#e6eef1;color:#0f1417}.type.Event{background:#e4f4f3;color:#0e7490}
  .ev .evt{font-weight:700;font-size:14px}
  .ev .when{font-size:12px;color:var(--ink2);margin-top:3px}
  .ev .when b{color:var(--ink)}
  .travel{margin-top:10px;border:1px solid var(--line2);background:var(--cream);border-radius:10px;padding:9px 11px}
  .travel .th{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent3);display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .travel .tr{font-size:12px;color:var(--ink2);line-height:1.5}
  .travel .tr b{color:var(--ink)}
  .rsvp{display:flex;gap:7px;margin-top:10px}
  .rb{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink2);text-align:center}
  .rb .c{display:block;font-size:15px;font-family:Georgia,serif}
  .rb.go.on{background:#d9f2f0;border-color:#9fdad4;color:#0a6f6f}
  .rb.mb.on{background:#eef2f4;border-color:#cdd6da;color:#475569}
  .rb.no.on{background:#f2f4f5;border-color:#d3dadd;color:#1f2937}
  .trip{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .trip .d{flex:none;text-align:center;background:var(--accent);color:var(--onAccent);border-radius:8px;padding:5px 8px;min-width:52px}
  .trip .d .mo{font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .trip .d .dy{font-family:Georgia,serif;font-weight:800;font-size:18px;line-height:1}
  .trip .ti{font-weight:700;font-size:13.5px}
  .trip .tx{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.5}
  .trip .tx b{color:var(--ink2)}
  .roster{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .rosterhide{text-align:center;padding:22px 16px}
  .rosterhide .rc{font-family:Georgia,serif;font-weight:700;font-size:40px;line-height:1;color:var(--accent)}
  .rosterhide .rt{font-size:13.5px;color:var(--ink2);margin-top:5px;font-weight:600}
  .rosterhide .rn{font-size:12px;color:var(--mut);margin-top:12px;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.5}
  @media(max-width:560px){.roster{grid-template-columns:1fr}}
  .ath{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:10px;padding:8px 11px}
  .ath .av{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--onAccent);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
  .ath .an{font-weight:700;font-size:13px}.ath .ap{font-size:11px;color:var(--mut)}
  .msg{border-bottom:1px solid var(--line2);padding:9px 0}
  .msg:last-child{border-bottom:none}
  .msg .mh{font-size:12px;color:var(--mut)}.msg .mh b{color:var(--accent)}
  .msg .mt{font-size:13.5px;color:var(--ink);margin-top:2px}
  .post{display:flex;gap:8px;margin-top:10px}
  .post input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)}
  .mut{color:var(--mut)}
  .scrim{position:fixed;inset:0;background:rgba(10,20,20,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}.scrim.on{display:flex}
  .modal{background:var(--card);border-radius:16px;max-width:480px;width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  .modal h2{color:var(--accent);font-size:19px;margin-bottom:4px}
  .modal .hint{font-size:11.5px;color:var(--mut);margin-bottom:12px}
  .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:12px 0 6px}
  .fld{margin-bottom:9px}.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:13.5px;background:var(--paper);color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .sw{display:flex;gap:7px;flex-wrap:wrap}
  .sw b{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent}
  .sw b.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
  .mrow{display:flex;gap:9px;margin-top:14px;align-items:center}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink2)}
  .del{background:none;border:none;color:#b23b3b;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-right:auto}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}
</style>
<meta name="theme-color" content="#0f9d9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="format-detection" content="telephone=yes">
<link rel="apple-touch-icon" href="/momentum-logo.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<script src="/hub-nav.js" defer></script>
<script src="/data.js"></script>
<script src="/assistant.js" defer></script>
<div class="wrap">
  <div class="eyebrow" id="eb"></div>
  <h1>Team App</h1>
  <div class="kpis">
    <div class="stat"><div class="n" id="kTeams">—</div><div class="l">Teams</div></div>
    <div class="stat"><div class="n" id="kAth">—</div><div class="l">Athletes</div></div>
    <div class="stat"><div class="n" id="kEv">—</div><div class="l">Upcoming events</div></div>
    <div class="stat"><div class="n" id="kTrip">—</div><div class="l">Upcoming trips</div></div>
  </div>
  <div class="grid">
    <div class="rail">
      <div class="railhead"><div class="l">Teams</div><div class="sp"></div><button class="addbtn" id="addTeamBtn" onclick="openTeam()">＋ Team</button></div>
      <div id="rail"></div>
    </div>
    <div id="main"></div>
  </div>
</div>

<!-- Event modal -->
<div class="scrim" id="evScrim" onclick="if(event.target===this)closeEv()"><div class="modal">
  <h2 id="evTitle">New event</h2>
  <div class="hint">Practices, competitions, showcases. Add travel details for away events.</div>
  <div class="two"><div class="fld"><label>Type</label><select id="f_type"><option>Practice</option><option>Competition</option><option>Showcase</option><option>Event</option></select></div>
    <div class="fld"><label>Title</label><input id="f_title" placeholder="Full routine run"></div></div>
  <div class="two"><div class="fld"><label>Date</label><input id="f_date" type="date"></div>
    <div class="fld"><label>Time</label><input id="f_time" placeholder="6:00 PM"></div></div>
  <div class="fld"><label>Venue</label><input id="f_location" placeholder="Spokane Arena, WA"></div>
  <div class="grp">Travel (optional)</div>
  <div class="fld"><label>Hotel</label><input id="f_hotel" placeholder="DoubleTree Spokane City Center"></div>
  <div class="fld"><label>Hotel address</label><input id="f_hotelAddr" placeholder="322 N Spokane Falls Ct, Spokane WA"></div>
  <div class="fld"><label>Depart / call time</label><input id="f_depart" placeholder="Depart Fri 4:00 PM · call 8:30 AM Sat"></div>
  <div class="mrow"><button class="del" id="evDel" style="display:none" onclick="delEv()">Delete</button><button class="btn" style="flex:1" onclick="saveEv()">Save event</button><button class="mini" onclick="closeEv()">Cancel</button></div>
</div></div>

<!-- Team modal -->
<div class="scrim" id="tmScrim" onclick="if(event.target===this)closeTeam()"><div class="modal">
  <h2 id="tmTitle">New team</h2>
  <div class="hint">Add every one of Momentum's teams — competitive, exhibition, and rec.</div>
  <div class="fld"><label>Team name</label><input id="t_name" placeholder="Flare"></div>
  <div class="two"><div class="fld"><label>Level</label><select id="t_level"><option>Competitive</option><option>Exhibition</option><option>Rec</option></select></div>
    <div class="fld"><label>Age / division</label><input id="t_age" placeholder="Ages 8–12 · Level 2"></div></div>
  <div class="fld"><label>Coach</label><input id="t_coach" placeholder="Coach Jordan"></div>
  <div class="fld"><label>Color</label><div class="sw" id="t_sw"></div></div>
  <div class="mrow"><button class="del" id="tmDel" style="display:none" onclick="delTeam()">Delete team</button><button class="btn" style="flex:1" onclick="saveTeam()">Save team</button><button class="mini" onclick="closeTeam()">Cancel</button></div>
</div></div>

<script>
(function(){
  var el=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var C=window.HUB_CONFIG||{}, BR=C.brand||{};
  var TEAMS=[], EVENTS=[], MSGS=[], curId=null, myResp={}, editEvId=null, editTmId=null, pickColor="#0f9d9d";
  // Who is looking decides what this page may show. Until whoami answers we
  // assume the most restricted view, so a slow network can never flash another
  // family's child on screen.
  var PRIV=C.privacy||{}, MY_ROLES=["parent"], WHO_KNOWN=false;
  function inList(list){ list=list||[]; for(var i=0;i<MY_ROLES.length;i++){ if(list.indexOf(MY_ROLES[i])>=0) return true; } return false; }
  function hideNames(){ return inList(PRIV.hideChildNamesFrom||[]); }
  function readOnly(){ return inList(PRIV.readOnlyFor||[]); }
  var SWATCH=["#0f9d9d","#0e7490","#0a6f6f","#14b8a6","#0891b2","#134e4a","#0f1417"];
  try{myResp=JSON.parse(localStorage.getItem('mom_rsvp')||'{}');}catch(e){myResp={};}
  el('eb').textContent=(BR.center||BR.name||'')+' · Parents & coaches';
  var bits=function(arr){return arr.filter(function(x){return x&&String(x).trim();}).map(esc).join(' \u00b7 ');};
  var lvClass=function(l){l=String(l||'').toLowerCase();return l.indexOf('comp')>=0?'comp':(l.indexOf('exh')>=0?'exh':'rec');};
  var initials=function(n){var p=String(n||'').trim().split(' ');return ((p[0]||' ')[0]+((p[1]||'')[0]||'')).toUpperCase();};
  var evsOf=function(t){return EVENTS.filter(function(e){return e.team===t;}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});};
  var future=function(e){return !e.date || e.date>=new Date().toISOString().slice(0,10);};
  var isTrip=function(e){return !!(e.hotel||e.depart);};
  var MOS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  var ROLE_READY=(window.hubWho||Promise.resolve(null)).then(function(w){
    var r=(w&&(w.roles||(w.role?[w.role]:[])))||[];
    MY_ROLES=r.length?r:["parent"]; WHO_KNOWN=true;
    if(readOnly()){ var ab=document.getElementById('addTeamBtn'); if(ab) ab.style.display='none'; }
  }).catch(function(){ MY_ROLES=["parent"]; WHO_KNOWN=true; });

  function load(){ Promise.all([window.HUBDATA.list('teams'),window.HUBDATA.list('teamevents'),window.HUBDATA.list('teammsgs')]).then(function(r){
    TEAMS=r[0]||[]; EVENTS=r[1]||[]; MSGS=r[2]||[];
    if((!curId||!TEAMS.find(function(x){return x.id===curId;}))&&TEAMS.length)curId=TEAMS[0].id;
    ROLE_READY.then(function(){ renderKpis(); renderRail(); renderMain(); }); }); }
  function renderKpis(){
    el('kTeams').textContent=TEAMS.length;
    el('kAth').textContent=TEAMS.reduce(function(s,t){return s+((t.roster||[]).length);},0);
    el('kEv').textContent=EVENTS.filter(future).length;
    el('kTrip').textContent=EVENTS.filter(function(e){return future(e)&&isTrip(e);}).length;
  }
  function renderRail(){
    el('rail').innerHTML=TEAMS.map(function(t){
      return '<div class="team'+(t.id===curId?' on':'')+'" data-id="'+esc(t.id)+'" style="border-left-color:'+(t.color||'var(--accent)')+'"><div class="tn">'+esc(t.name)+'</div><div class="tm">'+bits([t.age,t.practice,((t.roster||[]).length)+' athletes'])+'</div>'+(t.level?'<span class="lv '+lvClass(t.level)+'">'+esc(t.level)+'</span>':'')+'</div>';
    }).join('')||'<div class="mut" style="font-size:12.5px">No teams yet — tap ＋ Team.</div>';
    el('rail').querySelectorAll('[data-id]').forEach(function(x){x.addEventListener('click',function(){curId=x.getAttribute('data-id');renderRail();renderMain();});});
  }
  function renderMain(){
    var t=TEAMS.find(function(x){return x.id===curId;}); if(!t){el('main').innerHTML='<div class="panel mut">Add a team to get started.</div>';return;}
    var trips=evsOf(t.name).filter(function(e){return future(e)&&isTrip(e);});
    el('main').innerHTML=
      '<div class="panel"><div class="thead"><div><div class="tt">'+esc(t.name)+'</div><div class="meta">'+bits([t.level,t.age,t.coach,t.practice,((t.roster||[]).length)+' athletes'])+'</div></div><div class="sp"></div>'+(readOnly()?'':'<button class="lnk" onclick="editTeam()">Edit</button> <button class="btn" onclick="openEv()">＋ Event</button>')+'</div></div>'+
      (trips.length?'<div class="panel"><div class="sec-t">Upcoming travel</div><div id="trips"></div></div>':'')+
      '<div class="panel"><div class="sec-t">Schedule &amp; RSVP</div><div id="sched"></div></div>'+
      rosterPanel(t)+
      '<div class="panel"><div class="sec-t">Announcements</div><div id="msgs"></div>'+(readOnly()?'':'<div class="post"><input id="postText" placeholder="Post to the team…"><button class="btn" onclick="postMsg()">Post</button></div>')+'</div>';
    if(trips.length)renderTrips(trips); renderSched(t); renderMsgs(t.name);
  }
  // Parents get the size of the team, never the names in it. Do not "improve"
  // this by putting first names or initials back -- that is still a roster of
  // other people's children.
  function rosterPanel(t){
    var n=(t.roster||[]).length;
    if(hideNames()){
      return '<div class="panel"><div class="sec-t">Roster</div>' +
        '<div class="rosterhide"><div class="rc">'+n+'</div><div class="rt">'+(n===1?'athlete on this team':'athletes on this team')+
        '</div><div class="rn">'+esc(PRIV.note||'Names are hidden here on purpose.')+'</div></div></div>';
    }
    return '<div class="panel"><div class="sec-t">Roster</div><div class="roster">'+
      ((t.roster||[]).map(function(a){
        return '<div class="ath"><div class="av">'+esc(initials(a.athlete))+'</div><div><div class="an">'+esc(a.athlete)+'</div>'+
          '<div class="ap">'+esc(a.parent||'')+(a.phone?' · '+esc(a.phone):'')+'</div></div></div>';
      }).join('')||'<div class="mut">No athletes yet.</div>')+'</div></div>';
  }

  function renderTrips(trips){
    el('trips').innerHTML=trips.map(function(e){
      var d=e.date?e.date.split('-'):['','',''];var mo=d[1]?MOS[(+d[1])-1]:'';var dy=d[2]||'';
      return '<div class="trip"><div class="d"><div class="mo">'+mo+'</div><div class="dy">'+dy+'</div></div><div><div class="ti">'+esc(e.title||e.type)+'</div>'+
      '<div class="tx">'+(e.location?'<b>'+esc(e.location)+'</b><br>':'')+(e.hotel?''+esc(e.hotel)+(e.hotelAddr?' · '+esc(e.hotelAddr):'')+'<br>':'')+(e.depart?''+esc(e.depart):'')+'</div></div></div>';
    }).join('');
  }
  function renderSched(t){
    var evs=evsOf(t.name);
    el('sched').innerHTML=evs.length?evs.map(function(e){
      var mine=myResp[e.id];
      var trav=isTrip(e)?'<div class="travel"><div class="th">Travel</div><div class="tr">'+(e.location?'Venue: <b>'+esc(e.location)+'</b><br>':'')+(e.hotel?'Hotel: <b>'+esc(e.hotel)+'</b>'+(e.hotelAddr?' — '+esc(e.hotelAddr):'')+'<br>':'')+(e.depart?''+esc(e.depart):'')+'</div></div>':'';
      return '<div class="ev"><div class="er"><span class="type '+esc(e.type||'Event')+'">'+esc(e.type||'Event')+'</span><span class="evt">'+esc(e.title||'')+'</span><span class="sp"></span>'+(readOnly()?'':'<button class="lnk" data-edit="'+esc(e.id)+'">Edit</button>')+'</div>'+
        '<div class="when"><b>'+esc(e.date||'')+'</b> · '+esc(e.time||'')+(e.location&&!isTrip(e)?' · '+esc(e.location):'')+'</div>'+trav+
        '<div class="rsvp"><button class="rb go'+(mine==='go'?' on':'')+'" data-ev="'+esc(e.id)+'" data-r="go"><span class="c">'+(+e.going||0)+'</span>Going</button>'+
        '<button class="rb mb'+(mine==='mb'?' on':'')+'" data-ev="'+esc(e.id)+'" data-r="mb"><span class="c">'+(+e.maybe||0)+'</span>Maybe</button>'+
        '<button class="rb no'+(mine==='no'?' on':'')+'" data-ev="'+esc(e.id)+'" data-r="no"><span class="c">'+(+e.out||0)+'</span>Out</button></div></div>';
    }).join(''):'<div class="mut">No events yet — add a practice or competition.</div>';
    el('sched').querySelectorAll('[data-ev]').forEach(function(b){b.addEventListener('click',function(){rsvp(b.getAttribute('data-ev'),b.getAttribute('data-r'));});});
    el('sched').querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){openEv(b.getAttribute('data-edit'));});});
  }
  var KEYMAP={go:'going',mb:'maybe',no:'out'};
  function rsvp(evId,r){
    var e=EVENTS.find(function(x){return x.id===evId;}); if(!e)return;
    var prev=myResp[evId];
    if(prev===r){ e[KEYMAP[r]]=Math.max(0,(+e[KEYMAP[r]]||0)-1); delete myResp[evId]; }
    else { if(prev)e[KEYMAP[prev]]=Math.max(0,(+e[KEYMAP[prev]]||0)-1); e[KEYMAP[r]]=(+e[KEYMAP[r]]||0)+1; myResp[evId]=r; }
    try{localStorage.setItem('mom_rsvp',JSON.stringify(myResp));}catch(x){}
    window.HUBDATA.save('teamevents',e).then(function(){ var t=TEAMS.find(function(x){return x.id===curId;}); renderSched(t); });
  }
  function renderMsgs(team){
    var m=MSGS.filter(function(x){return x.team===team;}).sort(function(a,b){return (b.ts||'').localeCompare(a.ts||'');});
    el('msgs').innerHTML=m.length?m.map(function(x){return '<div class="msg"><div class="mh"><b>'+esc(x.author||'Coach')+'</b> · '+esc((x.ts||'').slice(0,10))+'</div><div class="mt">'+esc(x.text||'')+'</div></div>';}).join(''):'<div class="mut">No announcements yet.</div>';
  }
  window.postMsg=function(){ var t=TEAMS.find(function(x){return x.id===curId;}); var txt=el('postText').value.trim(); if(!t||!txt)return;
    window.HUBDATA.save('teammsgs',{team:t.name,author:'You',text:txt,ts:new Date().toISOString()}).then(function(){ el('postText').value=''; window.HUBDATA.list('teammsgs').then(function(a){MSGS=a||[];renderMsgs(t.name);}); }); };

  // ---- Event modal
  function openEv(id){ editEvId=id||null; var e=id?EVENTS.find(function(x){return x.id===id;}):null;
    el('evTitle').textContent=e?'Edit event':'New event';
    el('f_type').value=e?e.type:'Practice'; el('f_title').value=e?(e.title||''):''; el('f_date').value=e?(e.date||''):''; el('f_time').value=e?(e.time||''):'';
    el('f_location').value=e?(e.location||''):''; el('f_hotel').value=e?(e.hotel||''):''; el('f_hotelAddr').value=e?(e.hotelAddr||''):''; el('f_depart').value=e?(e.depart||''):'';
    el('evDel').style.display=e?'block':'none'; el('evScrim').classList.add('on'); }
  window.openEv=openEv;
  window.closeEv=function(){ el('evScrim').classList.remove('on'); };
  window.saveEv=function(){ var t=TEAMS.find(function(x){return x.id===curId;}); if(!t)return;
    var e=editEvId?EVENTS.find(function(x){return x.id===editEvId;}):{team:t.name,going:0,maybe:0,out:0};
    e.team=t.name; e.type=el('f_type').value; e.title=el('f_title').value; e.date=el('f_date').value; e.time=el('f_time').value;
    e.location=el('f_location').value; e.hotel=el('f_hotel').value; e.hotelAddr=el('f_hotelAddr').value; e.depart=el('f_depart').value;
    window.HUBDATA.save('teamevents',e).then(function(){ closeEv(); window.HUBDATA.list('teamevents').then(function(a){EVENTS=a||[];renderKpis();renderMain();}); }); };
  window.delEv=function(){ if(!editEvId)return; window.HUBDATA.del('teamevents',editEvId).then(function(){ closeEv(); window.HUBDATA.list('teamevents').then(function(a){EVENTS=a||[];renderKpis();renderMain();}); }); };

  // ---- Team modal
  function swatches(){ el('t_sw').innerHTML=SWATCH.map(function(c){return '<b data-c="'+c+'" class="'+(c===pickColor?'on':'')+'" style="background:'+c+'"></b>';}).join('');
    el('t_sw').querySelectorAll('[data-c]').forEach(function(b){b.addEventListener('click',function(){pickColor=b.getAttribute('data-c');swatches();});}); }
  function openTeam(){ editTmId=null; el('tmTitle').textContent='New team'; el('t_name').value=''; el('t_level').value='Competitive'; el('t_age').value=''; el('t_coach').value=''; pickColor=SWATCH[0]; swatches(); el('tmDel').style.display='none'; el('tmScrim').classList.add('on'); }
  window.openTeam=openTeam;
  window.editTeam=function(){ var t=TEAMS.find(function(x){return x.id===curId;}); if(!t)return; editTmId=t.id; el('tmTitle').textContent='Edit team'; el('t_name').value=t.name||''; el('t_level').value=(/comp/i.test(t.level)?'Competitive':(/exh/i.test(t.level)?'Exhibition':'Rec')); el('t_age').value=t.age||''; el('t_coach').value=t.coach||''; pickColor=t.color||SWATCH[0]; swatches(); el('tmDel').style.display='block'; el('tmScrim').classList.add('on'); };
  window.closeTeam=function(){ el('tmScrim').classList.remove('on'); };
  window.saveTeam=function(){ var name=el('t_name').value.trim(); if(!name)return;
    var t=editTmId?TEAMS.find(function(x){return x.id===editTmId;}):{roster:[]};
    var oldName=t.name;
    t.name=name; t.level=el('t_level').value; t.age=el('t_age').value; t.coach=el('t_coach').value; t.color=pickColor;
    window.HUBDATA.save('teams',t).then(function(r){ var nid=t.id||(r&&r.id);
      var after=function(){ curId=nid; window.HUBDATA.list('teams').then(function(a){TEAMS=a||[];closeTeam();renderKpis();renderRail();renderMain();}); };
      // if renamed, keep events/msgs linked
      if(editTmId&&oldName&&oldName!==name){ Promise.all(EVENTS.filter(function(e){return e.team===oldName;}).map(function(e){e.team=name;return window.HUBDATA.save('teamevents',e);}).concat(MSGS.filter(function(m){return m.team===oldName;}).map(function(m){m.team=name;return window.HUBDATA.save('teammsgs',m);}))).then(function(){window.HUBDATA.list('teamevents').then(function(a){EVENTS=a||[];window.HUBDATA.list('teammsgs').then(function(b){MSGS=b||[];after();});});}); }
      else after();
    }); };
  window.delTeam=function(){ if(!editTmId)return; window.HUBDATA.del('teams',editTmId).then(function(){ curId=null; window.HUBDATA.list('teams').then(function(a){TEAMS=a||[];closeTeam();if(TEAMS.length)curId=TEAMS[0].id;renderKpis();renderRail();renderMain();}); }); };

  // AssistantContext sends counts only -- never add roster entries here.
  window.AssistantContext=function(){ var t=TEAMS.find(function(x){return x.id===curId;}); return { view:'team app', teams:TEAMS.map(function(x){return {name:x.name,level:x.level,age:x.age,coach:x.coach,athletes:(x.roster||[]).length};}),
    upcomingTrips:EVENTS.filter(function(e){return future(e)&&isTrip(e);}).map(function(e){return {team:e.team,title:e.title,date:e.date,venue:e.location,hotel:e.hotel};}),
    currentTeam:t?t.name:null }; };
  load();
})();
</script>
</body>
