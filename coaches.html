<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coaches &amp; Staff</title>
<link rel="icon" href="/icons/momentum-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/skins.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#2a201a);background:var(--paper,#fbf7f2);min-height:100vh}
  h1,h2,h3{font-family:Georgia,serif;font-weight:800;margin:0}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 20px 70px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .bar{display:flex;align-items:center;gap:12px;margin:8px 0 16px;flex-wrap:wrap}.sp{flex:1}
  .pill{font-size:12.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px}.pill b{color:var(--accent)}
  .btn{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--onAccent);border:none;border-radius:10px;padding:11px 17px;font-weight:700;font-family:Georgia,serif;font-size:14px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 18px rgba(80,50,20,.08)}
  .ch{display:flex;align-items:center;gap:11px}
  .av{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,var(--accent),var(--accent2));color:var(--onAccent);display:grid;place-items:center;font-family:Georgia,serif;font-weight:800;font-size:18px;flex:none}
  .nm{font-family:Georgia,serif;font-weight:800;font-size:16px}
  .role{font-size:11.5px;color:var(--mut)}
  .progs{margin-top:9px;font-size:11.5px;color:var(--ink2)}
  .certs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .cert{font-size:10px;font-weight:700;background:#eef6f0;color:#2f6a52;border-radius:99px;padding:2px 8px}
  .cls{margin-top:9px;border-top:1px solid var(--line2);padding-top:8px;font-size:11.5px;color:var(--ink2)}
  .cls b{color:var(--accent)}
  .mut{color:var(--mut)}
  .scrim{position:fixed;inset:0;background:rgba(30,20,10,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}.scrim.on{display:flex}
  .modal{background:var(--card);border-radius:16px;max-width:480px;width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal h2{color:var(--accent);font-size:20px;margin-bottom:12px}
  .fld{margin-bottom:9px}.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:13.5px;background:var(--paper);color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .mrow{display:flex;gap:9px;margin-top:12px}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink2)}.del{color:#b23b3b;border-color:#e6c0c0}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}
</style>
</head>
<body>
<script src="/hub-nav.js" defer></script>
<script src="/data.js"></script>
<script src="/assistant.js" defer></script>
<div class="wrap">
  <div class="eyebrow" id="eb"></div>
  <h1>Coaches &amp; Staff</h1>
  <div class="bar">
    <span class="pill"><b id="pStaff">—</b> staff</span>
    <span class="pill"><b id="pCoach">—</b> coaches</span>
    <span class="pill"><b id="pCovered">—</b> classes covered</span>
    <div class="sp"></div>
    <button class="btn" onclick="openNew()">＋ Add staff</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)close2()"><div class="modal">
  <h2 id="mTitle">Add staff</h2>
  <div class="two"><div class="fld"><label>Name</label><input id="f_name"></div>
    <div class="fld"><label>Role</label><input id="f_role" placeholder="Gymnastics Coach"></div></div>
  <div class="fld"><label>Programs</label><input id="f_programs" placeholder="Gymnastics · Tumbling"></div>
  <div class="fld"><label>Certifications</label><input id="f_certs" placeholder="USAG · CPR · Background ✓"></div>
  <div class="two"><div class="fld"><label>Phone</label><input id="f_phone"></div>
    <div class="fld"><label>Email</label><input id="f_email"></div></div>
  <div class="fld"><label>Notes</label><textarea id="f_notes" style="min-height:44px"></textarea></div>
  <div class="mrow"><button class="btn" style="flex:1" onclick="saveIt()">Save</button><button class="mini del" id="delBtn" onclick="delIt()">Delete</button><button class="mini" onclick="close2()">Cancel</button></div>
</div></div>

<script>
(function(){
  var el=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var C=window.HUB_CONFIG||{}, BR=C.brand||{};
  var STAFF=[], CLASSES=[], CUR=null;
  el('eb').textContent=(BR.center||BR.name||'');
  function classesOf(name){ return CLASSES.filter(function(c){return (c.coach||'')===name;}); }
  function initials(n){ n=String(n||'').replace('Coach ','').trim(); var p=n.split(' '); return ((p[0]||' ')[0]+((p[1]||'')[0]||'')).toUpperCase(); }
  function load(){ Promise.all([window.HUBDATA.list('coaches'),window.HUBDATA.list('classes')]).then(function(r){ STAFF=r[0]||[]; CLASSES=r[1]||[]; render(); }); }
  function render(){
    el('pStaff').textContent=STAFF.length;
    el('pCoach').textContent=STAFF.filter(function(s){return /coach|director|instructor/i.test(s.role||'');}).length;
    var covered={}; CLASSES.forEach(function(c){if(c.coach)covered[c.coach]=1;});
    el('pCovered').textContent=CLASSES.filter(function(c){return STAFF.some(function(s){return s.name===c.coach;});}).length;
    el('grid').innerHTML=STAFF.map(function(s){ var cl=classesOf(s.name);
      return '<div class="card" data-id="'+esc(s.id)+'"><div class="ch"><div class="av">'+esc(initials(s.name))+'</div><div><div class="nm">'+esc(s.name||'')+'</div><div class="role">'+esc(s.role||'')+'</div></div></div>'+
        (s.programs?'<div class="progs">'+esc(s.programs)+'</div>':'')+
        '<div class="certs">'+String(s.certs||'').split('·').map(function(x){x=x.trim();return x?'<span class="cert">'+esc(x)+'</span>':'';}).join('')+'</div>'+
        '<div class="cls"><b>'+cl.length+'</b> class'+(cl.length===1?'':'es')+(cl.length?': '+cl.slice(0,3).map(function(c){return esc(c.name);}).join(', ')+(cl.length>3?'…':''):'')+'</div></div>';
    }).join('')||'<div class="pill">No staff yet.</div>';
    document.querySelectorAll('[data-id]').forEach(function(x){x.addEventListener('click',function(){openEdit(x.getAttribute('data-id'));});});
  }
  var F=['name','role','programs','certs','phone','email','notes'];
  function openNew(){ CUR=null; el('mTitle').textContent='Add staff'; F.forEach(function(k){el('f_'+k).value='';}); el('delBtn').style.display='none'; el('scrim').classList.add('on'); el('f_name').focus(); }
  function openEdit(id){ CUR=STAFF.find(function(x){return x.id===id;}); if(!CUR)return; el('mTitle').textContent='Edit staff'; F.forEach(function(k){el('f_'+k).value=CUR[k]==null?'':CUR[k];}); el('delBtn').style.display=''; el('scrim').classList.add('on'); }
  function saveIt(){ var rec=CUR?Object.assign({},CUR):{}; F.forEach(function(k){rec[k]=el('f_'+k).value;}); window.HUBDATA.save('coaches',rec).then(function(){close2();load();}); }
  function delIt(){ if(!CUR||!confirm('Remove this staff member?'))return; window.HUBDATA.del('coaches',CUR.id).then(function(){close2();load();}); }
  function close2(){ el('scrim').classList.remove('on'); }
  window.openNew=openNew;window.saveIt=saveIt;window.delIt=delIt;window.close2=close2;
  window.AssistantContext=function(){ return { view:'coaches & staff', staff:STAFF.map(function(s){return {name:s.name,role:s.role,programs:s.programs,certs:s.certs,classes:classesOf(s.name).length};}) }; };
  load();
})();
</script>
</body>
</html>
